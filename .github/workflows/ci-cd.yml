name: CI/CD

# Flow: feature branch → PR to `staging` (deploys staging) → PR `staging` → `main`
# (deploys production). See docs/ci-cd.md.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    # Throwaway database for the integration tests (row locking, unique
    # constraints, exactly-once writes). Same major version as the VPS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wedisense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test API
        run: pnpm --filter api test

      - name: Integration tests (PostgreSQL)
        run: pnpm --filter api test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wedisense_test

      - name: Build
        run: pnpm build
        env:
          # Dummy values — Next.js needs NEXT_PUBLIC_* at build time.
          # Real values live in apps/web/.env.local on the VPS (deploy builds there).
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # Both environments build on the same 2-CPU VPS, so every deploy shares one
  # concurrency group: a staging and a production deploy never build at once.
  deploy-staging:
    name: Deploy to staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-wedisense.wedison.tech
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          # Staging lives next to production: <VPS_APP_DIR>-staging.
          # Sync the checkout first so the deploy script and PM2 config that
          # run are the ones from this commit, never a stale copy.
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_APP_DIR }}-staging
            git fetch origin staging
            git reset --hard origin/staging
            DEPLOY_ENV=staging bash scripts/deploy.sh

  deploy-production:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wedisense.wedison.tech
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: cd ${{ secrets.VPS_APP_DIR }} && bash scripts/deploy.sh
