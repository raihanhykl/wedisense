<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Loan Overdue</title></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;color:#333">
  <div style="background:#dc2626;padding:16px;border-radius:8px 8px 0 0">
    <h1 style="color:#fff;margin:0;font-size:20px">Wedisense</h1>
  </div>
  <div style="background:#fff;border:1px solid #e5e7eb;border-top:none;padding:24px;border-radius:0 0 8px 8px">
    <p>Hello {{name}},</p>
    <p>The asset <strong>{{assetName}}</strong> ({{assetNumber}}) you borrowed is <strong>{{daysOverdue}} days overdue</strong>.</p>
    <p>Please return the asset as soon as possible.</p>
    <p>
      <a href="{{url}}" style="display:inline-block;background:#dc2626;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none">View Asset</a>
    </p>
  </div>
  <div style="text-align:center;padding:16px;color:#9ca3af;font-size:12px">
    Wedisense — Asset Management System
  </div>
</body>
</html>
