<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Peminjaman Terlambat</title></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;color:#333">
  <div style="background:#dc2626;padding:16px;border-radius:8px 8px 0 0">
    <h1 style="color:#fff;margin:0;font-size:20px">Wedisense</h1>
  </div>
  <div style="background:#fff;border:1px solid #e5e7eb;border-top:none;padding:24px;border-radius:0 0 8px 8px">
    <p>Halo {{name}},</p>
    <p>Aset <strong>{{assetName}}</strong> ({{assetNumber}}) yang Anda pinjam sudah <strong>terlambat {{daysOverdue}} hari</strong>.</p>
    <p>Silakan kembalikan aset tersebut sesegera mungkin.</p>
    <p>
      <a href="{{url}}" style="display:inline-block;background:#dc2626;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none">Lihat Aset</a>
    </p>
  </div>
  <div style="text-align:center;padding:16px;color:#9ca3af;font-size:12px">
    Wedisense — Sistem Manajemen Aset
  </div>
</body>
</html>
